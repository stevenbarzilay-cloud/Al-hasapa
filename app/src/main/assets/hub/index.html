<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>על הספה שלנו</title>
<script>
/* Safety net. Runs before anything else and has no dependencies: if the app fails to draw, the reason is shown on screen
   (and reported to the native side) instead of leaving a blank page. */
window.__errors=[];window.__ready=false;
/* Android WebView can report a layout height of 0 (percentage heights, 100vh and bottom:0 then collapse), while
   innerHeight is correct. So the app shell is sized in pixels from innerHeight and nothing depends on % heights. */
(function(){var r=document.documentElement;function fit(){var h=window.innerHeight||0;if(h>0)r.style.setProperty("--app-h",h+"px")}
  fit();addEventListener("resize",fit);addEventListener("load",fit);addEventListener("orientationchange",fit);
  if(window.visualViewport)visualViewport.addEventListener("resize",fit);
  var n=0,t=setInterval(function(){fit();if(++n>25)clearInterval(t)},100)})();
addEventListener("error",function(e){__errors.push(String(e.message||e.type)+(e.lineno?" @"+e.lineno+":"+e.colno:""))});
addEventListener("unhandledrejection",function(e){__errors.push("promise: "+String(e.reason&&e.reason.message||e.reason))});
setTimeout(function(){if(window.__ready)return;var d=document.createElement("div");
  d.style.cssText="position:fixed;left:8px;right:8px;top:8px;z-index:99999;background:#fff;color:#900;border:2px solid #900;border-radius:8px;padding:10px;font:12px/1.4 monospace;direction:ltr;white-space:pre-wrap";
  d.textContent="The couch did not load.\n"+(__errors.length?__errors.slice(0,4).join("\n"):"(no script error; still waiting)");
  (document.body||document.documentElement).appendChild(d)},5000);
</script>
<style>
/* Bundled font (SIL OFL, see THIRD_PARTY/IBM-Plex-OFL.txt). No network fonts: the hub must work offline. */
@font-face{font-family:"IBM Plex Sans Hebrew";font-weight:400;font-style:normal;font-display:swap;src:url("fonts/IBMPlexSansHebrew-Regular.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Sans Hebrew";font-weight:500;font-style:normal;font-display:swap;src:url("fonts/IBMPlexSansHebrew-Medium.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Sans Hebrew";font-weight:600;font-style:normal;font-display:swap;src:url("fonts/IBMPlexSansHebrew-SemiBold.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Sans Hebrew";font-weight:700;font-style:normal;font-display:swap;src:url("fonts/IBMPlexSansHebrew-Bold.woff2") format("woff2")}
:root{
  /* The logo and our illustrations carry the character; the interface stays quiet and readable.
     ink   = text, rules, symbols, primary buttons
     red   = Steve's piece (circle), the evening count, the one stamp
     pink  = Roni's piece (triangle), warm surfaces
     Hierarchy on every screen: the game, then the action, then the small personal details. */
  --cream:#F2EBDD;
  --card:#F8F3E9;
  --tint:#EAE1CF;
  --ink:#30232D;
  --ink-2:#67565F;
  --red:#D94E38;
  --pink:#E8A5B5;
  --line:rgba(48,35,45,.13);
  --line-2:rgba(48,35,45,.3);
  --font:"IBM Plex Sans Hebrew",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
  --press:cubic-bezier(.3,1.6,.5,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;overflow:hidden}
body{background:var(--cream);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
@media (min-width:1280px){body{font-size:17px}}
button,a,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
img{max-width:100%;height:auto;display:block}
:focus-visible{outline:2px solid var(--red);outline-offset:3px;border-radius:8px}
.wrap{max-width:1200px;margin:0 auto;padding:0 clamp(16px,3vw,36px)}
.help{font-size:.86em;color:var(--ink-2)}

/* ---------- shell: the logo and the menu never move, only the content scrolls ---------- */
.app{position:fixed;left:0;top:0;right:0;height:var(--app-h,100vh);display:flex;flex-direction:column;overflow:hidden}
.mast{order:1;flex:none}
.navbar{order:2;flex:none}
.stage{order:3;flex:1;min-height:0;position:relative}
.scroller{position:absolute;inset:0;overflow:auto;overscroll-behavior:contain}
.scroller::-webkit-scrollbar:horizontal{display:none}
.scroller.has-h{padding-bottom:40px}
/* Horizontal scroll indicator: always visible the moment the content is wider than the screen.
   Same language as the progress bar: tint track, ink thumb, with the one hard accent shadow. */
.hbar{position:absolute;left:0;right:0;bottom:0;height:40px;direction:ltr;display:flex;align-items:center;gap:4px;padding:0 6px;background:linear-gradient(to top,var(--cream) 62%,rgba(242,235,221,0));z-index:6}
.hbar[hidden]{display:none}
.hb-btn{flex:none;width:44px;height:44px;margin:-2px 0;display:grid;place-items:center;border-radius:50%;color:var(--ink)}
.hb-btn:active{background:var(--tint)}
.hb-btn:disabled{opacity:.25}
.hb-btn svg{width:16px;height:16px}
.hbar .track{position:relative;flex:1;height:12px;border-radius:999px;background:var(--tint);border:1px solid var(--line-2);touch-action:none}
.hbar .thumb{position:absolute;top:-1px;bottom:-1px;left:0;min-width:44px;border-radius:999px;background:var(--ink);box-shadow:2px 2px 0 var(--red);touch-action:none;cursor:grab}
.hbar .thumb::after{content:"";position:absolute;inset:-16px -6px}
.edge{position:absolute;top:0;bottom:40px;width:26px;z-index:5;pointer-events:none}
.edge[hidden]{display:none}
.edge.l{left:0;background:linear-gradient(to right,rgba(48,35,45,.16),rgba(48,35,45,0))}
.edge.r{right:0;background:linear-gradient(to left,rgba(48,35,45,.16),rgba(48,35,45,0))}
.dbg{position:fixed;inset-inline-start:6px;top:6px;z-index:70;background:var(--ink);color:var(--cream);font:11px/1.35 ui-monospace,monospace;padding:3px 7px;border-radius:6px;opacity:.9;pointer-events:none;direction:ltr;max-width:calc(100vw - 12px)}
.dbg[hidden]{display:none}
.reduce-motion *,.reduce-motion *::before,.reduce-motion *::after{animation:none!important;transition:none!important}
/* A TV box: no recolouring layers over the illustrations (blend modes on big images are heavy for a weak GPU), no shadows, no smooth scrolling. */
.tv .art .tint,.tv .art .lift{display:none!important}
.tv *{box-shadow:none!important;text-shadow:none!important;scroll-behavior:auto!important}
/* ---------- illustrations follow the pieces' colours ----------
   Each picture is the untouched original plus two layers, one per colour family in the art (the red family is Steve's
   shirt, mug and cushions; the pink family is Roni's shirt and the couch). A layer is a flat colour, cut out by a soft
   mask of its family and blended with mix-blend-mode:color: new hue and saturation, but every pixel keeps its own
   brightness, so shading and linework survive and skin, ink, hair and cream are never touched. */
.art{position:relative;display:block;isolation:isolate}
.art img{display:block;width:100%;height:auto}
.art .tint{position:absolute;inset:0;pointer-events:none;opacity:0;mix-blend-mode:color;-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.art .lift{position:absolute;inset:0;pointer-events:none;opacity:0;background-size:100% 100%;background-repeat:no-repeat;filter:brightness(var(--art-lift,1));-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.art .tr{background:var(--art-steve,#D94E38)}
.art .tp{background:var(--art-roni,#E8A5B5)}
:root.tint-r .art .tr,:root.tint-r .art .lift,:root.tint-p .art .tp{opacity:1}
/* ---------- the links sheet ---------- */
.urlrow{display:flex;flex-direction:column;gap:4px;padding:8px 0;border-bottom:1px solid var(--line)}
.urlrow b{font-weight:600}
.urlrow .tag{font-size:.75em;font-weight:500;border:1px dashed var(--red);color:var(--red);border-radius:5px;padding:0 6px;margin-inline-start:8px}
.urlrow input{font-size:.85em;text-align:left}
#ul{display:flex;flex-direction:column}
.lib-head .tbtn{min-height:36px;font-size:.85em}
/* ---------- our pieces: shape and colour per person ---------- */
.who-card{display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:1px solid var(--line)}
.who-card:first-of-type{border-top:0;padding-top:0}
.pick-l{font-weight:600;font-size:.85em;color:var(--ink-2)}
.pick{display:grid;gap:6px}
.pick.shapes{grid-template-columns:repeat(6,minmax(0,1fr))}
.pick.colors{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:380px){.pick.shapes{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pick .opt{height:44px;border-radius:12px;border:1px solid var(--line-2);display:grid;place-items:center;background:var(--card);transition:transform .12s var(--press),background .15s}
.pick .opt:active{transform:scale(.94)}
.pick .opt svg{width:26px;height:26px}
.pick .opt[aria-checked="true"]{border:2px solid var(--ink);background:var(--tint)}
.pick .opt[aria-checked="true"] svg,.pick .opt[aria-checked="true"] i{animation:hop .4s var(--press)}
.pick .opt:disabled{opacity:.28;cursor:not-allowed}
.pick .sw i{display:block;width:26px;height:26px;border-radius:50%;background:var(--c);border:1.5px solid var(--ink)}

/* ---------- masthead ---------- */
.mast .wrap{display:flex;align-items:center;gap:16px;padding-top:14px;padding-bottom:10px}
.logo{margin:0;line-height:0}
.logo img{height:64px;width:auto;aspect-ratio:900/444}
.mast .spacer{flex:1}
.mast .date{color:var(--ink-2);font-size:.9em;white-space:nowrap}
.who{display:flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:999px;padding:0 14px;min-height:44px;font-weight:500;font-size:.9em}
.who:hover{background:var(--tint)}
.who .gap{width:6px}

/* ---------- pieces: Steve = red circle, Roni = pink triangle ---------- */
.pc{display:inline-block;flex:none;width:16px;height:16px;vertical-align:-3px}
.pc.lg{width:26px;height:26px}

/* ---------- tabs ---------- */
.navbar .wrap{display:flex;border-bottom:1px solid var(--line-2)}
.tabs{display:flex;gap:2px}
.tab{position:relative;padding:10px 14px;min-height:44px;font-weight:500;color:var(--ink-2);display:inline-flex;align-items:center;gap:8px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);font-weight:600}
.tab[aria-selected="true"]::after{content:"";position:absolute;inset:auto 12px -1px;height:2px;background:var(--ink)}
.tab .n{font-variant-numeric:tabular-nums;font-size:.78em;background:var(--tint);border-radius:999px;padding:0 7px}
.tab svg{display:none}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:12px;font-weight:600;text-decoration:none;border:1px solid var(--ink);transition:transform .12s var(--press),box-shadow .12s ease,background .15s;user-select:none;white-space:nowrap}
.btn.primary{background:var(--ink);color:var(--cream)}
.btn.main{box-shadow:3px 3px 0 var(--red)}
.btn.main:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--red)}
.btn.primary:active{transform:translate(1px,1px)}
.btn.sm{min-height:38px;padding:0 14px;border-radius:10px;font-size:.9em}
.btn.ghost{background:transparent;border-color:var(--line-2)}
.btn.ghost:hover{background:var(--tint)}
.text-acts{display:flex;align-items:center;flex-wrap:wrap;gap:2px}
.tbtn{min-height:44px;padding:0 10px;border-radius:10px;font-weight:500;color:var(--ink-2);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.tbtn:hover{color:var(--ink);background:var(--tint)}
.tbtn:active{transform:translateY(1px)}

/* ---------- tonight ---------- */
.tonight{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(20px,3vw,44px);align-items:start;padding:clamp(18px,2.4vw,28px) 0 8px}
.feat{position:relative;margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px 10px;display:grid;grid-template-columns:52px 1fr;gap:2px 14px;align-items:start}
.feat .sym{width:52px;height:52px;border-radius:12px;background:var(--pink);display:grid;place-items:center;grid-row:span 3}
.feat .sym svg{width:28px;height:28px}
.feat .kicker{font-size:.82em;color:var(--ink-2);font-weight:500}
.feat h2{margin:0;font-size:clamp(22px,2vw,28px);font-weight:700;line-height:1.15}
.feat p{margin:0;color:var(--ink-2);font-size:.95em}
.feat .why{grid-column:2;margin:4px 0 0}
.feat .acts{grid-column:1/-1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.feat .acts .text-acts{margin-inline-start:auto}
.stamp{position:absolute;top:-11px;left:16px;transform:rotate(-5deg);border:1.5px solid var(--red);color:var(--red);background:var(--cream);font-weight:600;font-size:.74em;padding:1px 8px;border-radius:5px}
.left{grid-column:1/-1;font-size:.82em;color:var(--ink-2);padding:6px 0 2px}

.side{display:flex;flex-direction:column;gap:14px}
.ill-couple{width:100%;max-width:400px;margin:0 auto}
.count{display:flex;flex-direction:column;gap:8px}
.count .line{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.count b{font-size:2.4em;font-weight:700;color:var(--red);line-height:1;font-variant-numeric:tabular-nums}
.count .of{font-weight:600}
.bar{height:6px;border-radius:999px;background:var(--tint);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:999px;transition:width .4s ease}
.streak{display:flex;align-items:center;gap:6px;font-size:.9em;color:var(--ink-2)}
.to-lib{align-self:flex-start;font-weight:600;font-size:.92em;text-decoration:none;border-bottom:1px solid var(--ink);min-height:36px;display:inline-flex;align-items:flex-end}

/* ---------- library ---------- */
.lib-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:26px 0 8px;border-bottom:1px solid var(--line-2);scroll-margin-top:10px}
.lib-head h2{margin:0;font-size:1.3em;font-weight:700}
.lib-head .help{margin-inline-end:auto}
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.filters::-webkit-scrollbar{display:none}
.f{flex:none;min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);font-weight:500;font-size:.85em;color:var(--ink-2)}
.f:hover{color:var(--ink)}
.f[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--cream)}
.groups{display:grid;grid-template-columns:1fr;column-gap:44px}
@media (min-width:1100px){.groups{grid-template-columns:1fr 1fr}}
.group{margin-top:16px}
.group h3{display:flex;justify-content:space-between;margin:0;padding:0 0 6px;font-size:.78em;font-weight:600;color:var(--ink-2);letter-spacing:.03em;border-bottom:1px solid var(--line)}
.group h3 span{font-variant-numeric:tabular-nums}
.rows{list-style:none;margin:0;padding:0}
.row{position:relative;display:grid;grid-template-columns:28px minmax(0,1fr) auto auto auto;grid-template-areas:"sym nm extra tick play";align-items:center;gap:0 12px;min-height:58px;padding:7px 0;border-bottom:1px solid var(--line)}
.row .sym{grid-area:sym;display:grid;place-items:center}
.row .sym svg{width:22px;height:22px}
.row .nm{grid-area:nm;min-width:0}
.row .nm b{display:block;font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm span{display:block;font-size:.8em;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .extra{grid-area:extra;display:flex;align-items:center;gap:4px;font-size:.8em;color:var(--ink-2);white-space:nowrap}
.row .tick{grid-area:tick}
.row .play{grid-area:play;min-width:72px}
.row.done .nm b{color:var(--ink-2)}
.row.done .play{background:transparent;color:var(--ink);border-color:var(--line-2)}
.tick{display:inline-flex;align-items:center;gap:6px;min-height:44px;min-width:44px;justify-content:center;padding:0 8px;border-radius:10px;font-size:.84em;color:var(--ink-2)}
.tick:hover{background:var(--tint);color:var(--ink)}
.tick .box{flex:none;width:22px;height:22px;border:1.5px solid var(--line-2);border-radius:50%;display:grid;place-items:center;transition:background .15s,border-color .15s}
.tick .box svg{width:13px;height:13px}
.tick .box path{stroke-dasharray:20;stroke-dashoffset:20}
.tick[aria-pressed="true"]{color:var(--ink)}
.tick[aria-pressed="true"] .box{background:var(--ink);border-color:var(--ink)}
.tick[aria-pressed="true"] .box path{stroke-dashoffset:0;transition:stroke-dashoffset .28s ease .05s}
.tick.pop .box{animation:pop .35s var(--press)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.win{display:flex;align-items:center;gap:0}
.win .q{margin-inline-end:4px}
.win button{flex:none;width:36px;height:36px;display:grid;place-items:center;border-radius:50%;opacity:.4}
.win button:hover{opacity:.85;background:var(--tint)}
.win button[aria-pressed="true"]{opacity:1;background:var(--tint)}
.win button[aria-pressed="true"] .pc,.win button[aria-pressed="true"] .both{animation:hop .4s var(--press)}
@keyframes hop{0%{transform:translateY(0)}40%{transform:translateY(-6px)}100%{transform:translateY(0)}}
.both{display:inline-flex;align-items:center}
.both .pc:last-child{margin-inline-start:-5px}
.rm{position:absolute;top:50%;inset-inline-start:-36px;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;color:var(--ink-2);opacity:0;display:grid;place-items:center}
.row:hover .rm,.rm:focus-visible{opacity:1}
.rm:hover{background:var(--tint);color:var(--ink)}
.coda{display:flex;flex-direction:column;align-items:center;gap:6px;padding:40px 0 30px;text-align:center}
.coda .art{width:min(520px,90%)}
.coda b{font-weight:600}

/* ---------- under the cushions ---------- */
.disc{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(20px,3vw,44px);padding:clamp(18px,2.4vw,28px) 0 40px;align-items:start}
.lists{display:flex;flex-direction:column;gap:24px}
.lists h3{margin:0;font-size:1.05em;font-weight:700;padding-bottom:6px;border-bottom:1px solid var(--line-2)}
.lists p{margin:8px 0;font-size:.88em;color:var(--ink-2)}
.lists ul{list-style:none;margin:0;padding:0}
.lists li{display:flex;align-items:center;gap:10px;min-height:52px;border-bottom:1px solid var(--line)}
.lists li svg{width:20px;height:20px;flex:none}
.lists li b{flex:1;font-weight:500}
.empty-ill{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:10px 0}
.empty-ill .art{width:min(460px,100%)}

/* ---------- the dent (stats) ---------- */
.stats{padding:clamp(18px,2.4vw,28px) 0 40px;display:grid;grid-template-columns:repeat(12,1fr);gap:28px 40px}
.panel{grid-column:span 6}
.panel.wide{grid-column:1/-1}
.panel h3{margin:0 0 10px;font-size:.8em;font-weight:600;color:var(--ink-2);letter-spacing:.03em;padding-bottom:6px;border-bottom:1px solid var(--line)}
.score-wrap{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:28px;align-items:center}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;text-align:center;gap:10px}
.score .p b{display:block;font-size:clamp(56px,6vw,84px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.score .p.s b{color:var(--red)}
.score .p div{display:flex;align-items:center;justify-content:center;gap:6px;font-weight:600;margin-top:6px}
.score .vs{font-size:.88em;color:var(--ink-2);padding-bottom:30px;max-width:12ch}
.sbar{display:flex;height:8px;border-radius:999px;overflow:hidden;margin-top:16px;background:var(--tint)}
.sbar i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82em;color:var(--ink-2);margin-top:8px;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block;border:1px solid var(--line)}
.ill-board{width:min(380px,100%);margin:0 auto}
.facts{display:grid;grid-template-columns:repeat(2,1fr)}
.facts div{padding:10px 0;border-bottom:1px solid var(--line)}
.facts b{display:block;font-size:1.9em;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.facts span{font-size:.85em;color:var(--ink-2)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:116px}
.week .b{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.week .b i{display:block;width:100%;border-radius:4px 4px 0 0;background:var(--tint);min-height:4px}
.week .b.has i{background:var(--ink)}
.week .b.today i{background:var(--red)}
.week small{font-size:.76em;color:var(--ink-2)}
.week .today small{color:var(--ink);font-weight:600}
.heat{display:grid;grid-template-columns:repeat(15,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--card);border:1px solid var(--line)}
.top{list-style:none;margin:0;padding:0}
.top li{display:grid;grid-template-columns:24px 1fr auto;gap:12px;align-items:center;min-height:44px;border-bottom:1px solid var(--line)}
.top li svg{width:20px;height:20px}
.top li b{font-variant-numeric:tabular-nums}

/* ---------- sheet, toast, footer ---------- */
.overlay{position:absolute;inset:0;background:rgba(48,35,45,.4);display:none;place-items:center;z-index:50;padding:16px}
.overlay.show{display:grid}
.sheet{background:var(--cream);border-radius:18px;padding:22px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:14px;max-height:100%;overflow:auto;box-shadow:0 20px 50px -20px rgba(48,35,45,.5)}
.sheet h3{margin:0;font-size:1.3em}
.sheet label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.95em}
.sheet .lab{display:flex;align-items:center;gap:8px}
.sheet input,.sheet textarea{background:var(--card);border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;color:var(--ink);min-height:44px;font-weight:400}
.sheet textarea{min-height:110px;resize:vertical}
.sheet .help{font-weight:400}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,14px);background:var(--ink);color:var(--cream);padding:10px 18px;border-radius:12px;font-weight:500;opacity:0;transition:opacity .2s,transform .2s;z-index:60;pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:12px;padding-bottom:28px;border-top:1px solid var(--line);font-size:.85em;color:var(--ink-2)}
footer .joke{font-style:italic}

/* ---------- phone, portrait ---------- */
/* Breakpoints use width/height only, never the orientation feature: it flips when the on-screen keyboard
   shrinks the viewport, and that is how a phone ended up in the wide layout. */
@media (max-width:720px){
  .mast .wrap{padding-top:10px;padding-bottom:6px;gap:10px}
  .logo img{height:50px}
  .mast .date,.who .nmz{display:none}
  .navbar{order:4;background:var(--cream);border-top:1px solid var(--line-2)}
  .toast{bottom:calc(76px + env(safe-area-inset-bottom))}
  .navbar .wrap{padding:0 0 env(safe-area-inset-bottom);border:0}
  .tabs{width:100%;gap:0}
  .tab{flex:1;flex-direction:column;gap:2px;padding:8px 4px;font-size:.74em;min-height:60px}
  .tab svg{display:block;width:22px;height:22px}
  .tab .n{position:absolute;top:5px;inset-inline-start:calc(50% + 6px)}
  .tab[aria-selected="true"]::after{inset:-1px 32% auto;height:2px}
  .tonight,.disc{grid-template-columns:1fr;gap:20px}
  .feat{padding:14px 14px 8px;grid-template-columns:44px 1fr;gap:2px 12px}
  .feat .sym{width:44px;height:44px;grid-row:span 2}
  .feat p,.feat .why{grid-column:1/-1;margin-top:6px}
  .feat .acts .btn.main{flex:1 1 100%}
  .feat .acts .text-acts{margin-inline-start:0;width:100%;justify-content:space-between}
  .ill-couple{max-width:330px}
  .row{grid-template-columns:24px minmax(0,1fr) auto auto;grid-template-areas:"sym nm tick play" ". extra extra extra";min-height:60px}
  .row .extra:empty{display:none}
  .row .tick .tl{display:none}
  .row .play{min-width:64px}
  .rm{display:none}
  .stats{gap:24px}
  .panel{grid-column:1/-1}
  .score-wrap{grid-template-columns:1fr}
  .ill-board{width:min(260px,80%)}
}
/* ---------- phone, landscape ---------- */
@media (max-height:520px) and (min-width:721px){
  .mast .wrap{padding-top:8px;padding-bottom:4px}
  .logo img{height:44px}
  .tab{min-height:40px;padding:6px 12px}
  .tonight{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px;padding-top:14px}
  .feat p{display:none}
  .ill-couple{max-width:230px}
  .rm{display:none}
}

/* ---------- results & scoring ---------- */
.chip{min-height:32px;padding:0 10px;border-radius:999px;background:var(--tint);font-weight:600;font-size:.95em;color:var(--ink);font-variant-numeric:tabular-nums}
.chip:hover{background:var(--line-2)}
.chip.add{background:transparent;border:1px dashed var(--line-2);color:var(--ink-2);font-weight:500}
.tick.res{border:1px solid var(--line-2);font-weight:600;color:var(--ink);padding:0 12px}
.duel{display:flex;gap:10px;align-items:center;font-variant-numeric:tabular-nums}
.duel span{display:inline-flex;align-items:center;gap:4px}
.duel .lead{color:var(--ink);font-weight:700}
.group h3 em{font-style:normal;font-weight:400;margin-inline-start:8px;letter-spacing:0}
.count .pts{margin-inline-start:auto;font-size:.88em;color:var(--ink-2);font-variant-numeric:tabular-nums}
.team{display:flex;align-items:baseline;gap:10px}
.team b{font-size:clamp(48px,5vw,72px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.team span{color:var(--ink-2)}
.week em{font-style:normal;font-size:.72em;color:var(--ink-2);font-variant-numeric:tabular-nums;min-height:1.2em}
.crack{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:8px}
.crack div{display:flex;flex-direction:column;align-items:center;gap:2px}
.crack b{font-size:2.2em;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.crack span{font-size:.85em;color:var(--ink-2)}
.preview{min-height:1.5em;font-size:.92em;color:var(--ink-2);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.preview b{color:var(--ink)}
.sheet label.inline{flex-direction:row;align-items:center;gap:8px;font-weight:500}
.sheet label.inline input{min-height:auto;width:18px;height:18px;accent-color:var(--ink)}
.duelgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.duelside{border:1px solid var(--line);border-radius:12px;padding:10px;margin:0;display:flex;flex-direction:column;gap:8px;min-width:0}
.duelside legend{display:flex;align-items:center;gap:6px;font-weight:600;padding:0 4px}
.duelside textarea{min-height:80px}
.backup{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:14px}
.backup .btn{align-self:flex-start}
@media (max-width:520px){.duelgrid{grid-template-columns:1fr}}
@media (max-width:720px){.row.is-duel .extra:empty{display:none}.count .pts{margin-inline-start:0;width:100%}}

/* ---------- settings ---------- */
.set{padding:clamp(18px,2.4vw,28px) 0 40px;display:grid;gap:28px;max-width:780px}
.set .panel{grid-column:auto}
.set input,.set select,.set textarea{width:100%;background:var(--card);border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;color:var(--ink);min-height:48px;font-weight:400}
.set textarea{min-height:110px;resize:vertical}
.set select{appearance:none;-webkit-appearance:none}
.set .field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.set .field>span{font-weight:600}
.set .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.set label.inline{display:flex;align-items:center;gap:10px;min-height:48px}
.set label.inline input{width:22px;min-height:22px;height:22px}
.set .row-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.set pre{direction:ltr;text-align:left;white-space:pre-wrap;word-break:break-word;font-size:.8em;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin:0 0 10px;user-select:text}
.set .urlrow{padding:10px 0}
.set .urlrow .tbtn{align-self:flex-start;color:var(--red);min-height:40px}
.tv .set input,.tv .set select,.tv .set textarea{min-height:56px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<body>
<div class="app">

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M3 15h18v4H3z"/><path d="M5 15v-4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v4"/></svg>

  <button class="hb-btn" id="hbR" type="button" aria-label="לגלול ימינה"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5.5 3 5 5-5 5"/></svg></button>
</div>

<div class="overlay" id="overlay"><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<script>

/* The catalogue (sites and games) comes from games.json, through the app or, in a plain browser, by fetch. */
let SITES={}, GAMES=[], byId={};
function setCatalog(c){
  SITES=c.sites;GAMES=c.games;byId=Object.fromEntries(GAMES.map(g=>[g.id,g]));
  /* u0 = the catalogue's own link, u = the one in use (the app already applies the person's links; a plain browser gets the raw file) */
  for(const g of GAMES){g.u0=g.u0||g.u; if(state.urls&&state.urls[g.id]) g.u=state.urls[g.id]}
}
const KINDS = ["מילים","היגיון","ידע","מוזיקה","חושים","מספרים","זיכרון"];

/* ---------- state ---------- */
/* ---------- storage ----------
   In the app the state lives natively (window.couchNative, a bridge to the Android side): one JSON document, saved atomically,
   with a revision so a stale save can never overwrite a newer change (say, a result saved from the player).
   In a plain browser (tests, previews) it falls back to localStorage, so the page still works on its own. */
const LS="couch-games-v1", NATIVE=window.couchNative||null;
const DEFAULT_STATE=()=>({v:1,names:{a:"סטיב",b:"רוני"},prefs:{},log:{}});
let state=DEFAULT_STATE(), stateRev=0;
function readLocal(){try{const s=JSON.parse(localStorage.getItem(LS)||"null"); if(s&&s.v===1) return s}catch(e){} return null}
function loadState(){
  if(NATIVE){
    try{
      const r=JSON.parse(NATIVE.loadState());                 // {rev, fresh, state}
      stateRev=Number(r.rev)||0;
      if(!r.fresh&&r.state) return Object.assign(DEFAULT_STATE(),r.state);
      const old=readLocal();                                   // first run on the native store: bring over what this page kept before
      if(old){const n=Number(NATIVE.migrateState(JSON.stringify(old))); if(n>0) stateRev=n; return Object.assign(DEFAULT_STATE(),old)}
      return DEFAULT_STATE();
    }catch(e){(window.__errors||[]).push("loadState: "+e)}
  }
  return Object.assign(DEFAULT_STATE(),readLocal()||{});
}
state=loadState();
let view="lib", filter="all";
function reloadState(){state=loadState();applyTheme();render()}
/* The app calls this when it comes back to the front, after something else (the player) may have changed the state. */
window.__reloadState=()=>{ if(!document.getElementById("overlay").classList.contains("show")) reloadState() };

const pad=n=>String(n).padStart(2,"0");
const key=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const daysAgo=n=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-n);return d};
const TODAY=()=>key(new Date());
const inLib=g=>state.prefs[g.id]?state.prefs[g.id]==="yes":!!g.lib;
const playedOn=(id,k)=>!!(state.log[k]&&state.log[k][id]);
const dayCount=k=>state.log[k]?Object.keys(state.log[k]).length:0;

function gameStreak(id){let n=0,i=playedOn(id,TODAY())?0:1;while(playedOn(id,key(daysAgo(i)))){n++;i++}return n}
function togetherStreak(){let n=0,i=dayCount(TODAY())?0:1;while(dayCount(key(daysAgo(i)))){n++;i++}return n}

function save(){
  // prune log older than 400 days
  const cutoff=key(daysAgo(400));
  for(const k of Object.keys(state.log)) if(k<cutoff) delete state.log[k];
  const json=JSON.stringify(state);
  if(NATIVE){
    let n=-1; try{n=Number(NATIVE.saveState(json,String(stateRev)))}catch(e){(window.__errors||[]).push("saveState: "+e)}
    if(n>=0) stateRev=n; else {reloadState();toast("הנתונים התעדכנו מבחוץ. נסו שוב.")}
  } else { try{localStorage.setItem(LS,json)}catch(e){} }
}

/* ---------- helpers ---------- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mono=(g,cls="mono")=>`<span class="${cls}" style="background:${SITES[g.s].color}">${esc(g.m)}</span>`;
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove("show"),1900)}

/* ================= visual language ================= */
view="home"; KINDS.push("גיאוגרפיה");
const SYM={
 "מילים":'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8.5 8.5h7M12 8.5v7.5"/>',
 "היגיון":'<rect x="4" y="4" width="16" height="16" rx="1.5"/><path d="M4 20 20 4"/>',
 "ידע":'<path d="M12 4.5 20 19H4z"/>',
 "מוזיקה":'<path d="M5 18v-6M9.7 18V6M14.3 18V9M19 18v-4"/>',
 "חושים":'<circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/>',
 "מספרים":'<circle cx="12" cy="12" r="8"/><path d="M12 8v8M8 12h8"/>',
 "זיכרון":'<path d="M4 16l4-8 4 8 4-8 4 8"/>',
 "גיאוגרפיה":'<circle cx="12" cy="12" r="8"/><ellipse cx="12" cy="12" rx="8" ry="3.2"/>'
};
const sym=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${SYM[k]||SYM["ידע"]}</svg>`;
/* ---- pieces: a shape and a colour per person (pieces.json ships with the app; this fallback keeps the prototype's look if it ever fails to load) ---- */
const FALLBACK_PCFG={defaults:{a:{shape:"circle",color:"red"},b:{shape:"triangle",color:"pink"}},
  shapes:[{id:"circle",n:"עיגול",d:"M10 2a8 8 0 1 0 0 16a8 8 0 1 0 0-16z"},{id:"triangle",n:"משולש",d:"M10 2.5 18.2 17H1.8z"}],
  colors:[{id:"red",n:"אדום",def:"האדום",base:"#D94E38",accent:"#D94E38",soft:"#EBA094"},{id:"pink",n:"ורוד",def:"הוורוד",base:"#E8A5B5",accent:"#D24E6D",soft:"#E8A5B5"}]};
let PCFG=FALLBACK_PCFG;
async function loadPieces(){try{const r=await Promise.race([fetch("pieces.json"),new Promise((_,no)=>setTimeout(()=>no(new Error("pieces.json timeout")),4000))]);if(r.ok){const j=await r.json();if(j&&Array.isArray(j.shapes)&&j.shapes.length&&Array.isArray(j.colors)&&j.colors.length&&j.defaults)PCFG=j}}catch(e){}}
const shapeOf=id=>PCFG.shapes.find(s=>s.id===id)||PCFG.shapes[0];
const colorOf=id=>PCFG.colors.find(c=>c.id===id)||PCFG.colors[0];
const piecesOf=()=>state.pieces&&state.pieces.a&&state.pieces.b?state.pieces:PCFG.defaults;
const svgPiece=(d,fill,c="pc")=>`<svg class="${c}" viewBox="0 0 20 20" aria-hidden="true"><path d="${d}" fill="${fill}" stroke="#30232D" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
const piece=(who,c="pc")=>{const p=piecesOf()[who];return svgPiece(shapeOf(p.shape).d,colorOf(p.color).base,c)};
const pieceName=who=>{const p=piecesOf()[who];return "ה"+shapeOf(p.shape).n+" "+colorOf(p.color).def};
/* Steve's colour takes the "red" role of the interface (the count, the stamp, the one hard shadow);
   Roni's takes the "pink" role (warm surfaces). Pick a colour and the whole app follows. */
const lum=h=>{const c=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255).map(v=>v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4));return .2126*c[0]+.7152*c[1]+.0722*c[2]};
const RED_LUM=lum("#D94E38");
/* css brightness() works on gamma-encoded values, so a luminance ratio R needs R^(1/2.2); never darken, never blow out */
const artLift=base=>Math.min(1.6,Math.max(1,Math.pow(lum(base)/RED_LUM,1/2.2)));
function applyTheme(){const p=piecesOf(),root=document.documentElement,r=root.style,ca=colorOf(p.a.color),cb=colorOf(p.b.color);
  r.setProperty("--red",ca.accent);r.setProperty("--pink",cb.soft);
  /* the pictures: Steve's family takes his piece colour, Roni's family takes her soft tone (it is a light surface);
     the original art is red and pink, so those need no layer at all and render exactly as drawn */
  r.setProperty("--art-steve",ca.base);r.setProperty("--art-lift",artLift(ca.base).toFixed(3));r.setProperty("--art-roni",cb.soft);
  root.classList.toggle("tint-r",ca.id!=="red");root.classList.toggle("tint-p",cb.id!=="pink")}
const pcS=(c="pc")=>piece("a",c);
const pcR=(c="pc")=>piece("b",c);
const PIECE={get s(){return pcS()},get r(){return pcR()}};
const bothHTML=()=>`<span class="both" aria-hidden="true">${pcS()}${pcR()}</span>`;
const CHECK='<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2.5 7.5 5.6 10.4 11.5 3.8" fill="none" stroke="#F2EBDD" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const art=(name,cls,w,h,alt)=>{const m=n=>`style="-webkit-mask-image:url(img/${name}-${n}.webp);mask-image:url(img/${name}-${n}.webp)"`;
  return `<span class="art ${cls}"><img src="img/${name}.webp" width="${w}" height="${h}" alt="${alt}"><i class="lift" style="background-image:url(img/${name}.webp);-webkit-mask-image:url(img/${name}-r.webp);mask-image:url(img/${name}-r.webp)"></i><i class="tint tr" ${m("r")}></i><i class="tint tp" ${m("p")}></i></span>`};
const IMG={
  couple:art("couple","ill-couple",1100,715,"סטיב ורוני על הספה, משחקים בטאבלט, והחתול השחור ישן על המסעד"),
  cats:art("cats","",1100,547,"שלושה חתולים ישנים על הספה, והשלט נעלם בין הכריות"),
  board:art("board","ill-board",900,804,"סטיב ורוני על כריות, מזיזים כלים על לוח")
};

/* ================= scoring =================
   Together games: one pasted result → couch points for the pair (2 for playing + up to 10 for the result).
   "מי פיצח?" is credit, not a win.  LinkedIn: each pastes their own result, the better one wins the duel. */
const isDuel=g=>g.s==="li";
const metricOf=g=>g.metric||"none";
const KIND_LABEL={guesses:"ניסיונות",mistakes:"טעויות",hints:"רמזים",time:"זמן",words:"מילים",none:"תוצאה"};
const fmtT=s=>{s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0")};
function parseResult(text,kind){
  const t=(text||"").trim(); if(!t) return null;
  if(kind==="time"){
    const m=t.match(/(\d{1,2}):(\d{2})(?::(\d{2}))?/);
    if(m){const v=m[3]!==undefined?(+m[1])*3600+(+m[2])*60+(+m[3]):(+m[1])*60+(+m[2]);return {v,fail:false}}
    const sec=t.match(/(\d+)\s*(?:seconds|sec|שניות)/i); if(sec) return {v:+sec[1],fail:false};
    return null;
  }
  if(kind==="guesses"){
    const m=t.match(/\b([1-9X])\s*\/\s*([1-9]\d?)\b/i);
    if(m){return m[1].toUpperCase()==="X"?{v:+m[2]+1,max:+m[2],fail:true}:{v:+m[1],max:+m[2],fail:false}}
    const g=t.match(/(\d+)\s*(?:guess(?:es)?|ניחושים|ניסיונות|clues?)/i); if(g) return {v:+g[1],max:5,fail:false};
    return null;
  }
  if(kind==="mistakes"){
    const rows=t.split(/\n/).map(l=>[...l.replace(/\s/g,"")].filter(c=>/[\u{1F7E6}-\u{1F7EB}]/u.test(c))).filter(r=>r.length===4);
    if(rows.length){const bad=rows.filter(r=>new Set(r).size>1).length;const good=rows.length-bad;return {v:bad,fail:good<4&&bad>=4}}
    const m=t.match(/(\d)\s*(?:mistakes?|טעויות|טעות)/i); if(m) return {v:+m[1],fail:+m[1]>=4};
    return null;
  }
  if(kind==="hints"){const n=(t.match(/💡/gu)||[]).length; if(/[🔵🟡]/u.test(t)||n) return {v:n,fail:false}; const m=t.match(/(\d+)\s*(?:hints?|רמזים)/i); return m?{v:+m[1],fail:false}:null}
  if(kind==="words"){const m=t.match(/(\d+)\s*(?:words?|מילים)/i); return m?{v:+m[1],fail:false}:null}
  return null;
}
function bestTime(id,excludeKey){let b=null;for(const k in state.log){if(k===excludeKey)continue;const e=state.log[k][id];if(e&&e.r&&e.r.kind==="time"&&!e.r.fail){b=b===null?e.r.v:Math.min(b,e.r.v)}}return b}
function resultPts(id,r,dayKey){
  if(!r||r.v===undefined||r.v===null||r.v==="") return 0;
  if(r.fail) return 0;
  if(r.kind==="guesses"){const m=r.max||6;return Math.max(1,Math.round(10*(m+1-r.v)/m))}
  if(r.kind==="mistakes") return [10,7,4,2][Math.min(r.v,3)];
  if(r.kind==="hints") return [10,7,5,3][Math.min(r.v,3)];
  if(r.kind==="time"){const b=bestTime(id,dayKey);return b===null||r.v<b?10:r.v<=b*1.25?7:5}
  if(r.kind==="words") return Math.min(10,Math.max(2,Math.round(14-r.v*2)));
  return 5;
}
function entryPts(id,e,dayKey){if(!e||e.d) return 0; return 2+resultPts(id,e.r,dayKey)}
function dayPts(k){let s=0;const d=state.log[k]||{};for(const id in d) s+=entryPts(id,d[id],k);return s}
function duelWinner(e,kind){
  const a=e&&e.d&&e.d.a, b=e&&e.d&&e.d.b; if(!a||!b) return null;
  const sc=x=>x.fail?Infinity:x.v;
  if(sc(a)===sc(b)) return "t"; return sc(a)<sc(b)?"a":"b";
}
const fmtVal=(kind,r)=>!r?"":r.fail?"לא נפתר":kind==="time"?fmtT(r.v):kind==="guesses"?(r.v+(r.max?"/"+r.max:"")):r.v+" "+KIND_LABEL[kind];

function addMany(){
  const lines=document.getElementById("manyTxt").value.split(/\n/).map(l=>l.trim()).filter(Boolean);
  let ok=0; const bad=[];
  for(const l of lines){
    const parts=l.split("|").map(x=>x.trim());
    if(parts.length<2||!parts[0]||!validUrl(parts[1])){bad.push(l.slice(0,30));continue}
    newCustom(parts[0],parts[1],parts[2],"none",true); ok++;
  }

  render();

}

    let r; try{r=JSON.parse(NATIVE.importBackup(document.getElementById("impTxt").value))}catch(e){toast("משהו השתבש בייבוא.");return}
    if(!r.ok){toast(r.message);return}
    onSheetClose=null; closeSheet(); reloadState(); toast(r.message);
  });
});

/* ================= interactions ================= */
function setView(v){view=v;document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.view===v));
  ["home","disc","stats","settings"].forEach(x=>document.getElementById("v-"+x).hidden=x!==v);render();document.getElementById("scroller").scrollTo({top:0,left:0})}
document.querySelector(".tabs").addEventListener("click",e=>{const b=e.target.closest(".tab");if(b)setView(b.dataset.view)});
document.querySelector("main").addEventListener("click",e=>{
  const pl=e.target.closest("[data-play]"); if(pl){playGame(pl.dataset.play);return}
  const go=e.target.closest("[data-goto]"); if(go){setView(go.dataset.goto);return}
  const f=e.target.closest("[data-filter]"); if(f){filter=f.dataset.filter;renderHome();document.getElementById("lib").scrollIntoView({block:"start"});return}
  const a=e.target.closest("[data-act]"); if(!a) return;
  const act=a.dataset.act, host=a.closest("[data-id]"), id=a.dataset.id||(host&&host.dataset.id), t=TODAY();
  if(act==="shuffle"){featOffset++;renderHome();return}
  if(act==="accounts"){NATIVE?NATIVE.openAccounts():toast("החשבונות זמינים באפליקציה.");return}
  if(act==="urls"){setView("settings");return}
  if(act==="saveLinks"){saveLinks();return}
  if(act==="addGame"){addGameFromForm();return}
  if(act==="addMany"){addMany();return}
  if(act==="delcustom"){delCustom(id);return}
  if(act==="copydiag"){copyDiag();return}
  if(act==="result"){openResult(id);return}
  if(act==="duel"){openDuel(id);return}
  if(act==="mark"){
    state.log[t]=state.log[t]||{};
    const was=!!state.log[t][id];
    if(was){delete state.log[t][id]; if(!Object.keys(state.log[t]).length) delete state.log[t];}
    else {state.log[t][id]={w:"",t:Date.now()}; toast(pickLine(["סומן. רוצים להדביק תוצאה?","יש. +2 נקודות ספה.","נרשם על הספה."]));}
    save(); render();
    if(!was){const b=document.querySelector(`.row[data-id="${id}"] .tick`); if(b) b.classList.add("pop");}
  } else if(act==="win"){
    const cur=state.log[t]&&state.log[t][id]; if(!cur) return;
    cur.w=cur.w===a.dataset.w?"":a.dataset.w; cur.t=Date.now(); save(); render();
    if(cur.w) toast(cur.w==="t"?"פיצחנו ביחד.":nm(cur.w)+" פיצח את "+byId[id].n+".");
  } else if(act==="remove"){state.prefs[id]="no"; save(); render(); toast(byId[id].n+" ירד מהספה.")}
  else if(act==="restore"){delete state.prefs[id]; save(); render(); toast(byId[id].n+" חזר מתחת לכריות.")}
  else if(act==="yes"||act==="no"||act==="later"){state.prefs[id]=act; save(); render(); toast(act==="yes"?byId[id].n+" נוסף לערב.":act==="no"?"דילגנו.":"נשמר להמשך.")}
});

/* ================= shell helpers ================= */
if(/[?&]rm=1\b/.test(location.search)) document.documentElement.classList.add("reduce-motion");
if(/[?&]tv=1\b/.test(location.search)) document.documentElement.classList.add("tv","reduce-motion");
const scroller=document.getElementById("scroller");
/* Horizontal scroll indicator. Physical (left/right) maths on purpose, so RTL cannot confuse it. */
(function(){
  const bar=document.getElementById("hbar"),track=document.getElementById("hbTrack"),thumb=document.getElementById("hbThumb"),
        bl=document.getElementById("hbL"),br=document.getElementById("hbR"),eL=document.getElementById("edgeL"),eR=document.getElementById("edgeR");
  let max=0;
  const rtl=()=>getComputedStyle(scroller).direction==="rtl";
  const phys=()=>rtl()?scroller.scrollLeft+max:scroller.scrollLeft;      /* 0 = the physical left end */
  function update(){
    max=Math.max(0,scroller.scrollWidth-scroller.clientWidth);
    const on=max>2; bar.hidden=!on; scroller.classList.toggle("has-h",on);
    if(!on){eL.hidden=eR.hidden=true;return}
    const tw=track.clientWidth,w=Math.max(44,tw*scroller.clientWidth/scroller.scrollWidth),f=Math.min(1,Math.max(0,phys()/max));
    thumb.style.width=w+"px"; thumb.style.left=(f*(tw-w))+"px";
    bl.disabled=f<=.01; br.disabled=f>=.99; eL.hidden=f<=.01; eR.hidden=f>=.99;
  }
  window.updateHBar=update;
  scroller.addEventListener("scroll",update,{passive:true});
  addEventListener("resize",update); addEventListener("load",update);
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(update);
  new ResizeObserver(update).observe(scroller);
  new MutationObserver(()=>requestAnimationFrame(update)).observe(document.querySelector("main"),{childList:true,subtree:true});
  const step=()=>Math.max(120,scroller.clientWidth*.8);
  bl.addEventListener("click",()=>scroller.scrollBy({left:-step(),behavior:"smooth"}));
  br.addEventListener("click",()=>scroller.scrollBy({left:step(),behavior:"smooth"}));
  let drag=null;
  thumb.addEventListener("pointerdown",e=>{thumb.setPointerCapture(e.pointerId);drag={x:e.clientX,p:phys()};e.preventDefault()});
  thumb.addEventListener("pointermove",e=>{if(!drag)return;const tw=track.clientWidth,w=thumb.offsetWidth,ratio=max/Math.max(1,tw-w);
    const p=Math.min(max,Math.max(0,drag.p+(e.clientX-drag.x)*ratio));scroller.scrollLeft=rtl()?p-max:p});
  const end=()=>{drag=null}; thumb.addEventListener("pointerup",end); thumb.addEventListener("pointercancel",end);
  track.addEventListener("pointerdown",e=>{if(e.target!==track)return;const r=track.getBoundingClientRect();
    scroller.scrollBy({left:(e.clientX<r.left+(parseFloat(thumb.style.left)||0)?-1:1)*step(),behavior:"smooth"})});
})();
/* Hidden diagnostics: tap the logo three times to see what size the page thinks the screen is. */
(function(){
  const chip=document.createElement("div");chip.className="dbg";chip.hidden=true;document.body.appendChild(chip);
  const mq=q=>matchMedia(q).matches?1:0;
  const fill=()=>{chip.textContent=`${innerWidth}x${innerHeight} @${devicePixelRatio} phone:${mq("(max-width:720px)")} short:${mq("(max-height:520px)")} portrait:${mq("(orientation:portrait)")} scroll:${scroller.scrollWidth}/${scroller.clientWidth}`};
  let n=0,t=0;
  document.querySelector(".logo").addEventListener("click",()=>{const now=Date.now();n=now-t<650?n+1:1;t=now;if(n>=3){n=0;chip.hidden=!chip.hidden;fill()}});
  addEventListener("resize",()=>{if(!chip.hidden)fill()}); setInterval(()=>{if(!chip.hidden)fill()},1000);
})();
