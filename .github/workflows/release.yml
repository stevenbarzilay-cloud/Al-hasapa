# The app for friends (2.0): both builds, signed with a private key that is kept in this repository's secrets (never in
# git), published as a GitHub Release. The page of the latest release is the one link handed to a friend:
#
#   https://github.com/stevenbarzilay-cloud/Al-hasapa/releases/latest
#
# and its two files keep the same names in every release, so these addresses always fetch the newest:
#
#   .../releases/latest/download/al-hasapa-phone.apk
#   .../releases/latest/download/al-hasapa-tv.apk
#
# Run it by hand: Actions -> "Release for friends" -> Run workflow. The steps (the key, the four secrets, the first
# run) are in docs/DISTRIBUTION.md. Our own devices do not use these builds: they keep the ones in dist/, signed
# with the repository's own key, so their updates go on installing over each other.
name: Release for friends

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "מה חדש בגרסה (שורה אחת, לא חובה)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: The signing key, from the secrets
        env:
          KEYSTORE_B64: ${{ secrets.COUCH_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.COUCH_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.COUCH_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.COUCH_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::The secret COUCH_$name is missing. The steps are in docs/DISTRIBUTION.md."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/couch-release.jks"
          test -s "$RUNNER_TEMP/couch-release.jks" || { echo "::error::COUCH_KEYSTORE_B64 is not a Base64 keystore."; exit 1; }

      - name: Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Tests (a build that fails them is not published)
        run: ./gradlew --console=plain :app:testPhoneDebugUnitTest :app:testTvDebugUnitTest

      - name: Build both apps
        env:
          COUCH_KEYSTORE_FILE: ${{ runner.temp }}/couch-release.jks
          COUCH_KEYSTORE_PASSWORD: ${{ secrets.COUCH_KEYSTORE_PASSWORD }}
          COUCH_KEY_ALIAS: ${{ secrets.COUCH_KEY_ALIAS }}
          COUCH_KEY_PASSWORD: ${{ secrets.COUCH_KEY_PASSWORD }}
        run: ./gradlew --console=plain :app:assemblePhoneRelease :app:assembleTvRelease

      - name: Name the files, and check how they are signed
        run: |
          mkdir -p out
          cp app/build/outputs/apk/phone/release/app-phone-release.apk out/al-hasapa-phone.apk
          cp app/build/outputs/apk/tv/release/app-tv-release.apk out/al-hasapa-tv.apk
          tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          # The repository's own key is public: a build for friends must never be signed with it.
          public="670e8ee0a5f57e9f045fd7a3978ce1afb98618185943ba7919a545346c2ad3f8"
          for f in out/al-hasapa-phone.apk out/al-hasapa-tv.apk; do
            digest="$("$tools/apksigner" verify --print-certs "$f" | grep -i 'SHA-256 digest' | head -1 | awk '{print $NF}')"
            echo "$f signed by $digest"
            test -n "$digest" || { echo "::error::$f is not signed."; exit 1; }
            if [ "$digest" = "$public" ]; then echo "::error::$f is signed with the repository's public key, not the private one."; exit 1; fi
          done
          version="$(grep -E 'versionName = "' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          tag="v$VERSION"
          { cat docs/RELEASE-NOTES.md; if [ -n "$NOTES" ]; then printf '\n\n## מה חדש בגרסה %s\n\n%s\n' "$VERSION" "$NOTES"; fi; } > notes.md
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" out/al-hasapa-phone.apk out/al-hasapa-tv.apk --clobber
            gh release edit "$tag" --notes-file notes.md --latest
          else
            gh release create "$tag" out/al-hasapa-phone.apk out/al-hasapa-tv.apk --title "על הספה שלנו $VERSION" --notes-file notes.md --target "$GITHUB_SHA" --latest
          fi

      - name: Both downloads answer at the fixed link
        run: |
          for f in al-hasapa-phone.apk al-hasapa-tv.apk; do
            url="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/$f"
            code="$(curl -s -o /dev/null -L -w '%{http_code}' "$url")"
            echo "$url -> $code"
            test "$code" = "200" || { echo "::error::$url does not answer yet ($code)."; exit 1; }
          done
          echo "The link is ready to be sent: https://github.com/${GITHUB_REPOSITORY}/releases/latest" >> "$GITHUB_STEP_SUMMARY"
